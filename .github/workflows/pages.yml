# Name of action
name: Build and Deploy Website to GitHub Pages

# What "Action" will trigger this
# In this case, this triggers on
# "When main is pushed"
on:
  workflow_dispatch:
  # push:
  #   branches: ["main"]

# Required permissions
# - reading repo contents
# - writing to Pages environment
# - token??? (required to function)
permissions:
  contents: read
  pages: write
  id-token: write

# If two pushes happen, cancel the
# current running one
concurrency:
  group: pages
  cancel-in-progress: true

# Set of "Actions" to do
jobs:
  build_homepage:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout This repository
        uses: actions/checkout@v6

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: src/homepage/package-lock.json

      - name: Install dependencies
        working-directory: src/homepage
        run: npm ci

      - name: Build Homepage
        run: npm run build

      - name: Upload Homepage Build Artifact
        uses: actions/upload-artifact@v7
        with:
          name: artifact
          path: ./
          if-no-files-found: error
          retention-days: 1
          # Note: This repo should ensure that is does make subpaths to
          # '/blog' and '/app/**'
          overwrite: true
    
      - name: Add .nojekyll
        run: touch dist/.nojekyll

  load_blog:
    runs-on: ubuntu-latest
    steps:
      - name: Get Run ID
        id: get-run
        env:
              GH_TOKEN: ${{ secrets.GH_BLOG_LOAD_TOKEN }}
        run: |
          RUN_ID=$(gh run list \
            --repo ChuggleBug/Blog \
            --status success \
            --limit 1 \
            --json databaseId \
            --jq '.[0].databaseId')
          echo "run_id=$RUN_ID" >> "$GITHUB_OUTPUT"
          
      - name: Upload Blog Build Artifact 
        parallel:
          - name: artifact
            uses: actions/download-artifact@v7
            with:     
              name: artifact
              path: ./blog
              if-no-files-found: error
              retention-days: 1
              overwrite: true

