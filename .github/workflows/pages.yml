# Name of action
name: Build and Deploy Website to GitHub Pages

# What "Action" will trigger this
# In this case, this triggers on
# "When main is pushed"
on:
  push:
    branches: ["main"]

# Required permissions
# - reading repo contents
# - writing to Pages environment
# - token??? (required to function)
permissions:
  contents: read
  pages: write
  id-token: write

# If two pushes happen, cancel the
# current running one
concurrency:
  group: "pages"
  cancel-in-progress: true

# Set of "Actions" to do
jobs:
  # Setup all static content
  build:
    runs-on: ubuntu-latest

    steps:

      # -----------------------
      # Tell GH Actions to get this repo
      # -----------------------
      - name: Checkout repository
        uses: actions/checkout@v6

      # ----------------------------------------------
      # Load external projects (blog, wikigraph, etc)
      # ----------------------------------------------
      # This clones the external repos into _work/
      # so downstream steps (bundler-cache, build.sh)
      # can see them.
      # ----------------------------------------------
      - name: Make scripts executable
        run: chmod +x load.sh build.sh

      - name: Load external repos
        env:
          GH_BLOG_LOAD_TOKEN: ${{ secrets.GH_BLOG_LOAD_TOKEN }}
        run: ./load.sh

      # ----------------------------------------------
      # Setup Node environment
      # ----------------------------------------------
      # install any dependencies inside
      # package-lock
      # ----------------------------------------------
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: src/homepage/package-lock.json

      - name: Install Pages dependencies
        working-directory: src/homepage
        run: npm ci

      # ----------------------------------------------
      # Setup Ruby (required by Jekyll)
      # ----------------------------------------------
      # Software developed on ruby 3.4.1, so we use that
      # Blog now lives in _work/blog after load.sh runs,
      # so bundler-cache needs to point there.
      # ----------------------------------------------
      - name: Setup Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: 3.3.1
          bundler-cache: true
          working-directory: _work/blog

      # ----------------------------------------------
      # Build everything
      # ----------------------------------------------
      # build.sh handles:
      #   - homepage (npm run build -> dist/)
      #   - blog (jekyll build -> dist/blog)
      #   - wikigraph app (copy -> dist/app/wikigraph)
      # ----------------------------------------------
      - name: Build site
        run: ./build.sh

      - name: Add .nojekyll
        run: touch dist/.nojekyll

      # ----------------------------------------------
      # Upload site to Pages
      # ----------------------------------------------
      # Because the website is built on 'dist',
      # we have to tell GH Pages to look there
      # ----------------------------------------------
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      # ----------------------------------------------
      # Let Pages handle it from here
      # ----------------------------------------------
      # Since we gave it Document Root, we can now
      # just tell it to deploy whatever we gave it
      # ----------------------------------------------
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4